<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión PMT Institucional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css" rel="stylesheet">

    <!-- Select2 CDN para selección múltiple -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

    <!-- Leaflet CSS (para el iframe del mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

    <style>
        /* Estilos CSS omitidos por brevedad */

        /* Estilo para imagen de mapa en PDF */
        .pdf-map-image { width: 100%; height: 220px; object-fit: cover; }

        /* ... otros estilos ... */
    </style>
</head>
<body>
    <!-- Contenido HTML omitido por brevedad (filtros, tabla, etc.) -->

    <!-- IFrame del mapa generado por QGIS2web -->
    <iframe id="mapaIframe" src="mapa_qgis.html" width="100%" height="100%" style="border:none;"></iframe>

    <!-- Modal u otro contenedor con el contenido del PDF -->
    <div id="pdf-content" class="a4-preview" style="display: none;">
        <div class="pdf-header-banner">
            <!-- Encabezado del PDF -->
            <h1 class="pdf-header-title">INFORME TÉCNICO DE GESTIÓN PMT</h1>
            <div class="pdf-header-date" id="pdf-date-gen"></div>
            <!-- Logo -->
            <img src="logo_epm.jpg" onerror="this.src='logo_epm.png'" style="height: 35px;" alt="EPM">
        </div>
        <div class="pdf-body">
            <div class="pdf-grid">
                <div class="pdf-map-container">
                    <div class="pdf-map-title">📍 Vista de Enfoque Espacial</div>
                    <!-- 
                        Imagen del mapa: aquí se asignará la captura de pantalla del mapa
                        INYECCIÓN: el src de este <img> se reemplaza dinámicamente con el dataURL generado
                    -->
                    <img id="pdf-map-snapshot" class="pdf-map-image"
                         src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Capturando Mapa...">
                </div>
                <!-- Aquí irían los KPI u otros elementos del PDF -->
                <!-- ... -->
            </div>
            <!-- Cuerpo del informe con datos de la tabla -->
            <!-- ... -->
        </div>
    </div>

    <!-- Scripts JS necesarios -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
    <!-- Carga de html2pdf (para generar el PDF al final) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- html2canvas en el documento principal (no es usado para el iframe) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
    async function openPdfPreview() {
        // Verificar que la tabla esté lista
        if (!window.$ || !$.fn.dataTable || !$.fn.dataTable.isDataTable('#tablaDatos')) {
            alert('La tabla aún está cargando. Espera unos segundos e intenta de nuevo.');
            return;
        }
        var table = $('#tablaDatos').DataTable();
        var filas = table.rows({ filter: 'applied' }).data();
        if (filas.length === 0) { alert('No hay datos en la tabla. Ajusta los filtros.'); return; }

        var btnText   = document.getElementById('btn-pdf-text');
        btnText.innerText = '⏳ Capturando mapa...';

        // Obtener captura del mapa
        var mapUrl = await capturarMapaParaPDF();
        if (mapUrl) {
            document.getElementById('pdf-map-snapshot').src = mapUrl;
        }
        btnText.innerText = '⏳ Procesando datos...';

        // Procesar filas de la tabla para generar el contenido del PDF
        // (este código permanece igual)
        // ...
        // Finalmente, generar el PDF:
        var opt = { 
            margin:       1,
            filename:     'reportePMT.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' },
            pagebreak:    { mode: ['css', 'legacy'] }
        };
        html2pdf().set(opt).from(document.getElementById('pdf-content')).save()
            .then(function(){ closePdfPreview(); });
    }

    function closePdfPreview() {
        // Cerrar/preparar la vista previa (puede estar oculta)
        // ...
    }

    function capturarMapaParaPDF() {
        return new Promise(function(resolve) {
            try {
                var iframe    = document.getElementById('mapaIframe');
                var iframeWin = iframe.contentWindow;
                var iframeDoc = iframe.contentDocument || iframeWin.document;

                if (!iframeWin || !iframeWin.map) { resolve(null); return; }
                var mapEl = iframeDoc.getElementById('map');
                if (!mapEl) { resolve(null); return; }

                /* INYECCIÓN: Intentar usar leaflet-image para capturar el mapa (evita problemas de CORS) */
                if (iframeWin && iframeWin.map) {
                    if (typeof iframeWin.leafletImage === 'function') {
                        // Si la función leafletImage ya está disponible, usarla directamente
                        try {
                            iframeWin.leafletImage(iframeWin.map, function(err, canvas) {
                                if (!err && canvas) {
                                    // Convertir canvas a dataURL y resolver la promesa
                                    resolve(canvas.toDataURL('image/png'));
                                } else {
                                    console.warn('[PDF] Leaflet-image error:', err);
                                    resolve(null);
                                }
                            });
                        } catch(e) {
                            console.warn('[PDF] Leaflet-image excepción:', e);
                            resolve(null);
                        }
                        return;
                    }
                    // Si no está cargado aún, inyectar el script leaflet-image
                    if (!iframeDoc.getElementById('__leafletImage__')) {
                        var leafScript = iframeDoc.createElement('script');
                        leafScript.id = '__leafletImage__';
                        leafScript.src = 'https://cdn.jsdelivr.net/npm/leaflet-image@0.4.0/leaflet-image.js';
                        leafScript.onload = function() {
                            // Tras cargar leaflet-image, capturar el mapa
                            if (typeof iframeWin.leafletImage === 'function') {
                                try {
                                    iframeWin.leafletImage(iframeWin.map, function(err, canvas) {
                                        if (!err && canvas) {
                                            resolve(canvas.toDataURL('image/png'));
                                        } else {
                                            console.warn('[PDF] Leaflet-image error:', err);
                                            resolve(null);
                                        }
                                    });
                                } catch(e) {
                                    console.warn('[PDF] Leaflet-image excepción:', e);
                                    resolve(null);
                                }
                            } else {
                                resolve(null);
                            }
                        };
                        leafScript.onerror = function() { resolve(null); };
                        iframeDoc.head.appendChild(leafScript);
                        return;
                    } else {
                        // Script ya inyectado: esperar a que leafletImage esté disponible
                        var tLeaf = 0;
                        var pollLeaf = setInterval(function() {
                            tLeaf++;
                            if (typeof iframeWin.leafletImage === 'function') {
                                clearInterval(pollLeaf);
                                try {
                                    iframeWin.leafletImage(iframeWin.map, function(err, canvas) {
                                        if (!err && canvas) {
                                            resolve(canvas.toDataURL('image/png'));
                                        } else {
                                            console.warn('[PDF] Leaflet-image error:', err);
                                            resolve(null);
                                        }
                                    });
                                } catch(e) {
                                    console.warn('[PDF] Leaflet-image excepción:', e);
                                    resolve(null);
                                }
                            } else if (tLeaf > 40) {
                                clearInterval(pollLeaf);
                                resolve(null);
                            }
                        }, 100);
                        return;
                    }
                }
                /* FIN INYECCIÓN */

                /* El código original usaba html2canvas, pero no es efectivo aquí debido a CORS */
                function ejecutarCaptura() {
                    iframeWin.html2canvas(mapEl, {
                        allowTaint:      true,
                        useCORS:         false,
                        backgroundColor: '#e8eaed',
                        scale:           1,
                        logging:         false,
                        imageTimeout:    0,
                        removeContainer: true
                    }).then(function(canvas) {
                        try {
                            resolve(canvas.toDataURL('image/jpeg', 0.92));
                        } catch(e) {
                            console.warn('[PDF] toDataURL error:', e);
                            resolve(null);
                        }
                    }).catch(function(e) {
                        console.warn('[PDF] html2canvas error:', e);
                        resolve(null);
                    });
                }

                // Resto del código de inyección de html2canvas (no se ejecutará si usamos leaflet-image)
                if (typeof iframeWin.html2canvas === 'function') {
                    ejecutarCaptura();
                    return;
                }
                if (!iframeDoc.getElementById('__h2c__')) {
                    var s = iframeDoc.createElement('script');
                    s.id = '__h2c__';
                    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                    s.onload = function() {
                        setTimeout(function() {
                            if (typeof iframeWin.html2canvas === 'function') {
                                ejecutarCaptura();
                            } else {
                                resolve(null);
                            }
                        }, 300);
                    };
                    s.onerror = function() { resolve(null); };
                    iframeDoc.head.appendChild(s);
                } else {
                    var t = 0;
                    var poll = setInterval(function() {
                        t++;
                        if (typeof iframeWin.html2canvas === 'function') {
                            clearInterval(poll);
                            ejecutarCaptura();
                        } else if (t > 40) {
                            clearInterval(poll);
                            resolve(null);
                        }
                    }, 100);
                }

            } catch(err) {
                console.warn('[PDF] capturarMapaParaPDF excepción:', err);
                resolve(null);
            }
        });
    }

    // Resto de funciones (filtrar datos, reproducir tiempo, etc.) sin cambios.
    </script>
</body>
</html>
